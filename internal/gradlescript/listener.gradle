

import groovy.json.JsonOutput
import org.gradle.api.tasks.testing.Test
import org.gradle.api.tasks.testing.TestDescriptor
import org.gradle.api.tasks.testing.TestListener
import org.gradle.api.tasks.testing.TestOutputEvent
import org.gradle.api.tasks.testing.TestOutputListener
import org.gradle.api.tasks.testing.TestResult

def outPath = System.getProperty('gtv.out')
def forceRerun = Boolean.parseBoolean(System.getProperty('gtv.rerun', 'false'))
def captureOutput = Boolean.parseBoolean(System.getProperty('gtv.output', 'false'))

if (outPath) {
  def sink = new File(outPath)
  sink.parentFile?.mkdirs()
  def writer = new PrintWriter(new OutputStreamWriter(new FileOutputStream(sink, true), 'UTF-8'))
  def lock = new Object()

  def emit = { Map event ->
    synchronized (lock) {
      writer.println(JsonOutput.toJson(event))
      writer.flush()
    }
  }





  def pathOf
  pathOf = { TestDescriptor d ->
    def self = (d.className ?: '~') + '#' + d.name
    d.parent == null ? self : pathOf(d.parent) + '/' + self
  }



  def keyOf = { String taskPath, TestDescriptor d ->
    try {
      return taskPath + '/' + String.valueOf(d.getId())
    } catch (Throwable ignored) {
      return taskPath + '/' + pathOf(d)
    }
  }

  def describe = { String taskPath, TestDescriptor d ->
    [
      key    : keyOf(taskPath, d),
      parent : d.parent == null ? null : keyOf(taskPath, d.parent),
      name   : d.name,
      display: d.displayName,
      cls    : d.className,
    ]
  }





  def probe = { obj, String name ->
    try {
      return obj."$name"
    } catch (MissingPropertyException ignored) {
      return null
    } catch (groovy.lang.MissingMethodException ignored) {
      return null
    }
  }

  def failureOf = { f ->
    def det = f.details
    [
      msg       : det.message,
      cls       : det.className,
      stack     : det.stacktrace,
      assertion : det.assertionFailure,
      assumption: probe(det, 'assumptionFailure'),


      expected  : det.expected,
      actual    : det.actual,
    ]
  }

  def failuresOf = { TestResult r ->
    r.failures.collect(failureOf)
  }



  def assumptionOf = { TestResult r ->
    def af = probe(r, 'assumptionFailure')
    af == null ? null : failureOf(af)
  }

  gradle.allprojects { project ->
    project.tasks.withType(Test).configureEach { testTask ->
      def taskPath = testTask.path





      if (forceRerun) {
        testTask.outputs.upToDateWhen { false }
        testTask.outputs.cacheIf { false }
      }

      testTask.addTestListener(new TestListener() {
        void beforeSuite(TestDescriptor suite) {
          emit(describe(taskPath, suite) + [e: 'suiteStart', task: taskPath, t: System.currentTimeMillis()])
        }

        void afterSuite(TestDescriptor suite, TestResult result) {
          emit(describe(taskPath, suite) + [
            e       : 'suiteEnd',
            task    : taskPath,
            res     : result.resultType.name(),
            start   : result.startTime,
            end     : result.endTime,
            total   : result.testCount,
            ok      : result.successfulTestCount,
            failed  : result.failedTestCount,
            skipped : result.skippedTestCount,
            failures: failuresOf(result),
          ])
        }

        void beforeTest(TestDescriptor test) {
          emit(describe(taskPath, test) + [e: 'testStart', task: taskPath, t: System.currentTimeMillis()])
        }

        void afterTest(TestDescriptor test, TestResult result) {
          emit(describe(taskPath, test) + [
            e       : 'testEnd',
            task    : taskPath,
            res     : result.resultType.name(),
            start   : result.startTime,
            end     : result.endTime,
            failures: failuresOf(result),
            assumed : assumptionOf(result),
          ])
        }
      })

      if (captureOutput) {
        testTask.addTestOutputListener(new TestOutputListener() {
          void onOutput(TestDescriptor test, TestOutputEvent event) {
            emit([
              e   : 'out',
              task: taskPath,
              key : keyOf(taskPath, test),
              dst : event.destination.name(),
              msg : event.message,
            ])
          }
        })
      }
    }
  }
}
